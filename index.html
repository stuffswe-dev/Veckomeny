<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Veckans meny</title>
<meta name="description" content="Familjens veckomeny, matbibliotek och inköpslista" />

<!-- PWA / hemskärm -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#3F5D48" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Meny" />
<link rel="icon" href="icon-192.png" />

<!-- Typsnitt -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

<!-- Tailwind (Play CDN) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/8.0.4/babel.min.js"></script>

<!-- PDF-export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Delning mellan enheter (Firebase Realtime Database) - konfiguration i src/shim.js -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  html, body { margin: 0; padding: 0; background: #FBF8F3; }
  .font-display { font-family: 'Fraunces', serif; }
  .font-body { font-family: 'Work Sans', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<!--
  Appens källkod ligger i src/shim.js och src/app.js (redigera dem, inte den
  här filen). De hämtas och slås ihop här nedan innan de körs, så att de delar
  samma variabler (t.ex. ikonerna i shim.js) precis som om de vore en fil.
-->
<script>
  window.__appErrors = [];
  function showFatalError(label, err) {
    var msg = (err && (err.stack || err.message)) ? (err.stack || err.message) : String(err);
    window.__appErrors.push(label + ': ' + msg);
    var root = document.getElementById('root');
    if (root) {
      root.innerHTML =
        '<div style="padding:24px;font-family:sans-serif;color:#8A6A22;white-space:pre-wrap">' +
        'Appen kraschade vid körning (' + label + ').\n\n' +
        'Kopiera texten nedan och skicka till Claude:\n\n' + msg + '</div>';
    }
  }
  window.addEventListener('error', function (e) {
    showFatalError('runtime error', e.error || e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showFatalError('unhandled promise rejection', e.reason);
  });
</script>
<script>
  (async () => {
    try {
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Babel === 'undefined') {
        const missing = [
          typeof React === 'undefined' && 'React',
          typeof ReactDOM === 'undefined' && 'ReactDOM',
          typeof Babel === 'undefined' && 'Babel',
        ].filter(Boolean).join(', ');
        throw new Error(
          `Kunde inte ladda: ${missing}. Troligen blockerar nätverket/routern cdnjs.cloudflare.com ` +
          'eller unpkg.com — testa på ett annat nätverk (t.ex. mobildata) eller kontrollera brandvägg/DNS-filter.'
        );
      }
      const stripBom = (text) => text.replace(/^[\uFEFF\u200B]+/, '');
      const fetchSrc = async (path) => {
        const res = await fetch(path);
        const text = await res.text();
        return { path, ok: res.ok, status: res.status, raw: text, clean: stripBom(text) };
      };
      const [shim, app] = await Promise.all([fetchSrc('src/shim.js'), fetchSrc('src/app.js')]);

      const describe = (f) => {
        const codes = Array.from(f.clean.slice(0, 8)).map((c) => c.charCodeAt(0));
        return `${f.path}: HTTP ${f.status}, ${f.clean.length} tecken, börjar med koderna [${codes.join(',')}]`;
      };

      if (!shim.ok || !app.ok || shim.clean.length < 20 || app.clean.length < 20) {
        throw new Error(
          'Filerna gick inte att hämta korrekt.\n' + describe(shim) + '\n' + describe(app)
        );
      }

      const combined =
        shim.clean +
        '\n\n' +
        app.clean +
        '\n\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(MealPlanner));';
      let code;
      try {
        code = Babel.transform(combined, { presets: ['react'] }).code;
      } catch (parseErr) {
        throw new Error(
          (parseErr && parseErr.message ? parseErr.message : parseErr) +
          '\n\nDIAGNOSTIK — skicka denna rad till Claude:\n' + describe(shim) + '\n' + describe(app)
        );
      }
      const script = document.createElement('script');
      script.textContent = code;
      document.body.appendChild(script);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<div style="padding:24px;font-family:sans-serif;color:#8A6A22;white-space:pre-wrap">' +
        'Kunde inte starta appen. Om du testar lokalt: dubbelklick på index.html ' +
        'räcker inte, kör en lokal server (se README) eller öppna den driftsatta ' +
        'länken istället.\n\n' + (err && err.message ? err.message : err) + '</div>';
    }
  })();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
